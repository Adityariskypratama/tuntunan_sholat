<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tuntunan Sholat</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #ffffff;
            width: 100%;
            max-width: 480px;
            padding: 30px 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            text-align: center;
        }

        .icon-header {
            font-size: 48px;
            margin-bottom: 10px;
        }

        h1 {
            color: #2c3e50;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 30px;
            line-height: 1.4;
        }

        .card {
            background-color: #fafafa;
            border: 2px solid #eef2f5;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: left;
            transition: all 0.3s ease;
        }

        .card:hover {
            border-color: #27ae60;
            transform: translateY(-2px);
        }

        .card-title {
            font-size: 18px;
            font-weight: 600;
            color: #2c3e50;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .card-desc {
            font-size: 13px;
            color: #666;
            margin-bottom: 16px;
            line-height: 1.5;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            text-align: center;
            transition: background 0.2s ease;
        }

        .btn-primary {
            background-color: #27ae60;
            color: #ffffff;
        }

        .btn-primary:hover {
            background-color: #219150;
        }

        .btn-secondary {
            background-color: #2980b9;
            color: #ffffff;
        }

        .btn-secondary:hover {
            background-color: #1f6694;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon-header">🕌</div>
        <h1>Tuntunan Tata Cara Sholat</h1>
        <p class="subtitle">Sesuai Sunnah Rasulullah (HPT Muhammadiyah)</p>

        <!-- Mode Dewasa -->
        <div class="card">
            <div class="card-title">
                <span>👨‍💼</span> Mode Dewasa
            </div>
            <p class="card-desc">Penyajian lengkap, formal, beserta keterangan sumber teks yang valid.</p>
            <a href="daftar_gerakan.html" class="btn btn-primary">Masuk Mode Dewasa</a>
        </div>

        <!-- Mode Anak-Anak -->
        <div class="card">
            <div class="card-title">
                <span>👶</span> Mode Anak-Anak
            </div>
            <p class="card-desc">Bahasa yang lebih sederhana dengan visual yang ramah anak.</p>
            <a href="detail_gerakan.html" class="btn btn-secondary">Masuk Mode Anak</a>
        </div>
    </div>

</body>
</html>
